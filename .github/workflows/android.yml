name: Android build

# Two kinds of build:
# - Test build (every push to main): APK for real phones only (arm64-v8a), no AAB,
#   no emulator test. Takes ~10-15 min. Download the APK from the repo's Releases page.
# - Store build (Actions -> Android build -> Run workflow -> "store", or push a tag like v1.0.0):
#   APK + AAB for every CPU type, plus the emulator launch test. Upload the AAB to Google Play.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'supabase/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      store:
        description: 'Store build: all CPU types + AAB for Google Play, with emulator test'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      ERGO_VERSION_CODE: ${{ github.run_number }}
      NODE_OPTIONS: --max-old-space-size=4096
      FULL: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.store == true }}
      # Compile C/C++ through ccache so unchanged native code is reused between builds.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      # The runner has ~14 GB free; a React Native release build with MapLibre's native
      # libraries for every CPU type needs more. Remove preinstalled tools we never use.
      - name: Free disk space
        if: env.FULL == 'true'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules/@aws-cdk "$AGENT_TOOLSDIRECTORY/PyPy" || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore native compile cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ env.FULL == 'true' && 'all' || 'arm64' }}
          max-size: 3G

      - name: Install dependencies
        id: install
        run: set -o pipefail; npm ci 2>&1 | tee -a "$RUNNER_TEMP/steps.log"

      - name: Type-check and lint
        id: typecheck
        run: set -o pipefail; { npx tsc --noEmit && npx eslint src app.config.ts --quiet; } 2>&1 | tee -a "$RUNNER_TEMP/steps.log"

      - name: Generate native Android project
        id: prebuild
        run: set -o pipefail; npx expo prebuild --platform android --no-install 2>&1 | tee -a "$RUNNER_TEMP/steps.log"

      - name: Prepare upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ERGO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ergo-upload.jks"
            echo "ERGO_UPLOAD_STORE_FILE=$RUNNER_TEMP/ergo-upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the ergo upload key."
          else
            echo "::warning::ERGO_UPLOAD_KEYSTORE_BASE64 is not set; signing with the debug key (fine for testing, not for Google Play)."
          fi

      - name: Build
        id: gradle
        working-directory: android
        env:
          ERGO_UPLOAD_STORE_PASSWORD: ${{ secrets.ERGO_UPLOAD_STORE_PASSWORD }}
          ERGO_UPLOAD_KEY_ALIAS: ${{ secrets.ERGO_UPLOAD_KEY_ALIAS }}
          ERGO_UPLOAD_KEY_PASSWORD: ${{ secrets.ERGO_UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          FLAGS="--no-daemon --stacktrace --build-cache --parallel"
          if [ "$FULL" = "true" ]; then
            echo "Store build: all CPU types, APK + AAB"
            ./gradlew assembleRelease bundleRelease $FLAGS 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          else
            echo "Test build: arm64-v8a APK only"
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a $FLAGS 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          fi
          ccache --show-stats 2>/dev/null | tee -a "$RUNNER_TEMP/gradle.log" || true

      - name: Collect outputs
        id: out
        run: |
          set -o pipefail
          {
            VERSION=$(node -p "require('./package.json').version")
            NAME="ergo-${VERSION}-build${{ github.run_number }}"
            mkdir -p dist
            echo "Build outputs:"; find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print
            APK=$(find android/app/build/outputs/apk -type f -name '*release*.apk' | head -1)
            AAB=$(find android/app/build/outputs/bundle -type f -name '*.aab' | head -1)
            test -n "$APK" && cp "$APK" "dist/${NAME}.apk"
            test -n "$AAB" && cp "$AAB" "dist/${NAME}.aab"
            ls -la dist
            echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee -a "$RUNNER_TEMP/steps.log"

      - name: Enable KVM for the emulator
        if: env.FULL == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installs the APK on an Android emulator, launches it and records logcat + screenshots.
      - name: Launch test on emulator
        id: smoke
        if: env.FULL == 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: bash .github/scripts/emulator.sh

      - name: Publish test release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ergo build ${{ github.run_number }}${{ env.FULL == 'true' && ' (store)' || '' }}
          prerelease: true
          body: |
            ${{ env.FULL == 'true' && 'Store build' || 'Test build (arm64 phones)' }} from ${{ github.sha }}.
            Install `${{ steps.out.outputs.name }}.apk` on an Android phone to test.
            ${{ env.FULL == 'true' && 'Upload the `.aab` file to Google Play.' || '' }}
          files: dist/*

      # Writes the result and the end of the build log to the `ci-status` branch,
      # so the build can be checked without access to the Actions UI.
      - name: Report status
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          # Make room so the report can be written even if the build filled the disk.
          rm -rf android/app/build/intermediates android/app/.cxx android/build ~/.gradle/caches/transforms-* 2>/dev/null || true
          {
            echo "# Android build ${{ github.run_number }}: ${RESULT}"
            echo
            echo "Disk: $(df -h / | tail -1)"
            echo
            echo "- Commit: ${{ github.sha }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/build-${{ github.run_number }}"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| install | ${{ steps.install.outcome }} |"
            echo "| typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| prebuild | ${{ steps.prebuild.outcome }} |"
            echo "| gradle | ${{ steps.gradle.outcome }} |"
            echo "| collect | ${{ steps.out.outcome }} |"
            echo "| launch test | ${{ steps.smoke.outcome }} |"
            echo "| release | ${{ steps.release.outcome }} |"
            echo
            echo "Files:"; ls -la dist 2>/dev/null | sed 's/^/    /'
            echo
            echo "## Launch test"
            echo '```'
            cat "$RUNNER_TEMP/smoke/result.txt" 2>/dev/null || { echo "(no result) emulator log:"; tail -60 "$RUNNER_TEMP/smoke/emulator.log" 2>/dev/null; }
            cat "$RUNNER_TEMP/smoke/logcat.txt" 2>/dev/null | tail -200
            echo '```'
            echo
            echo "## Other steps (tail)"
            echo '```'
            tail -40 "$RUNNER_TEMP/steps.log" 2>/dev/null || true
            echo '```'
            echo
            echo "## Gradle"
            echo '```'
            if [ -f "$RUNNER_TEMP/gradle.log" ]; then grep -nE "FAILURE|What went wrong|error:|e: |BUILD (SUCCESSFUL|FAILED)" "$RUNNER_TEMP/gradle.log" | tail -60; echo '---'; tail -120 "$RUNNER_TEMP/gradle.log"; else echo "Gradle did not run."; fi
            echo '```'
          } > "$RUNNER_TEMP/STATUS.md"
          git config user.name "ergo-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-status:ci-status 2>/dev/null || true
          git worktree add -f "$RUNNER_TEMP/status" ci-status 2>/dev/null || { git worktree add -f --orphan -b ci-status "$RUNNER_TEMP/status" 2>/dev/null || git worktree add -f -b ci-status "$RUNNER_TEMP/status"; }
          cd "$RUNNER_TEMP/status"
          git rm -rq . 2>/dev/null || true
          cp "$RUNNER_TEMP/STATUS.md" STATUS.md
          cp "$RUNNER_TEMP"/smoke/*.png . 2>/dev/null || true
          cp "$RUNNER_TEMP/smoke/logcat.txt" . 2>/dev/null || true
          git add -A
          git commit -qm "Build ${{ github.run_number }}: ${RESULT}" || true
          git push -q origin ci-status || true
