name: Launch test (latest release)

# Installs the APK from the newest GitHub Release on an emulator, opens it and records
# logcat + screenshots to the `ci-status` branch (launch/ folder). Run it by pushing to
# the `launch-test` branch, or from the Actions tab.

on:
  push:
    branches: [launch-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launch-test
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          TAG=$(gh release list -R "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" -R "${{ github.repository }}" -p '*.apk' -D dist
          ls -la dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on emulator
        id: smoke
        continue-on-error: true
        timeout-minutes: 25
        run: bash .github/scripts/emulator.sh

      - name: Report
        if: always()
        run: |
          {
            echo "# Launch test of ${TAG}: ${{ job.status }}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/smoke/result.txt" 2>/dev/null || { echo "(no result) emulator log:"; tail -80 "$RUNNER_TEMP/smoke/emulator.log" 2>/dev/null; }
            cat "$RUNNER_TEMP/smoke/logcat.txt" 2>/dev/null | tail -220
            echo '```'
          } > "$RUNNER_TEMP/LAUNCH.md"
          git config user.name "ergo-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-status:ci-status 2>/dev/null || true
          git worktree add -f "$RUNNER_TEMP/status" ci-status
          cd "$RUNNER_TEMP/status"
          rm -rf launch && mkdir launch
          cp "$RUNNER_TEMP/LAUNCH.md" launch/LAUNCH.md
          cp "$RUNNER_TEMP"/smoke/*.png launch/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/smoke/*.txt "$RUNNER_TEMP"/smoke/*.log launch/ 2>/dev/null || true
          git add -A
          git commit -qm "Launch test ${TAG}: ${{ job.status }}" || true
          git push -q origin ci-status || true
